<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3efe5">
  <title>Wortfeld · German recognition game</title>
  <meta name="description" content="Test your German word recognition on a visual board and save the words you know.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#board">Skip to game</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="wordmark" href="index.html"><span class="wordmark-mark">W</span><span class="wordmark-text">Wort für Wort</span></a>
    <div class="nav-links"><a href="read.html">Read</a><a href="game.html" aria-current="page">Play</a><a href="cards.html">Cards</a></div>
  </nav>
  <header class="page-head">
    <div class="eyebrow">Recognition game</div><h1>Wortfeld</h1><p>Choose a tile. Say the meaning before you reveal it. Green is known; red needs another look.</p>
  </header>
  <main class="game-shell" id="board">
    <section class="game-stats" aria-label="Game progress">
      <div class="stat"><b data-known-count>0</b><span>Known</span></div>
      <div class="stat"><b data-starred-count>0</b><span>Starred</span></div>
      <div class="stat"><b data-board-count>0</b><span>On this board</span></div>
    </section>
    <div class="word-board" data-word-board aria-label="German word tiles"></div>
    <section class="quiz-panel" aria-live="polite">
      <div class="quiz-top"><div class="quiz-word" data-quiz-word>Wähle ein Wort.</div><button class="button small" type="button" data-reveal disabled>Reveal + hear</button></div>
      <div class="quiz-answer" data-quiz-answer>Choose any tile to begin.</div>
      <div class="quiz-actions">
        <button class="button small" type="button" data-learning disabled>Still learning</button>
        <button class="button primary small" type="button" data-knew disabled>I knew it</button>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>Your choices stay on this device.</span><a href="cards.html">Practice with cards →</a></footer>
  <script src="german-data.js"></script><script src="store.js"></script><script src="app.js"></script><script src="game.js"></script>
</body>
</html>
